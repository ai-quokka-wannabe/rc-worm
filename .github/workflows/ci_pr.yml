name: CI - Pull Request

permissions:
    contents: read

on:
    pull_request:
        branches: ["**"]

# A new push to a pull request makes the previous run's result irrelevant, so stop paying for it.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quick-checks:
        name: Quick Checks (markdown)
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Node.js
              id: setup-node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                node-version: "lts/*"

            - name: Get markdownlint-cli2 version
              id: mdlint-version
              run: echo "version=$(npm view markdownlint-cli2 version)" >> "$GITHUB_OUTPUT"

            # Restore cache from main branch (read-only)
            - name: Restore npm cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                path: ~/.npm
                key: npm-markdownlint-${{ runner.os }}-node-${{ steps.setup-node.outputs.node-version }}-mdlint-${{ steps.mdlint-version.outputs.version }}

            - name: Install markdownlint-cli2
              run: npm install -g markdownlint-cli2@${{ steps.mdlint-version.outputs.version }}

            - name: Lint markdown
              run: markdownlint-cli2 "**/*.md"

            # A carriage return sitting inside a line is invisible in every editor, survives
            # rustfmt and markdownlint, and reads as ordinary text in review. The flagship's
            # main met three before this step existed there. .gitattributes normalises to LF
            # and this runner is Linux, so any match is a stray inside a line.
            - name: Check for stray carriage returns
              run: |
                if git ls-files -z | xargs -0 grep -lIP '\r'; then
                    echo "::error::The files above contain a carriage return. Line endings here are LF, so it is a stray one inside a line - look for a text written through a tool that ate an escape."
                    exit 1
                fi

            # lychee is installed from its pinned release archive with a checksum check rather
            # than through lycheeverse/lychee-action: the organisation runs GitHub-owned actions
            # only, and a verified download keeps that policy - and the trust it means - intact.
            - name: Install lychee
              shell: bash
              env:
                LYCHEE_VERSION: v0.24.2
                LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
              run: |
                curl -sSfL -o lychee.tar.gz "https://github.com/lycheeverse/lychee/releases/download/lychee-${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
                echo "${LYCHEE_SHA256}  lychee.tar.gz" | sha256sum --check --strict
                tar -xzf lychee.tar.gz
                sudo install -m 755 lychee-x86_64-unknown-linux-gnu/lychee /usr/local/bin/lychee
                rm -rf lychee.tar.gz lychee-x86_64-unknown-linux-gnu
                lychee --version

            # Every internal link and anchor in the documentation resolves - offline, so the
            # answer is deterministic and a third-party site cannot redden a pull request. The
            # external links have their own scheduled workflow.
            - name: Check internal links and anchors
              run: lychee --offline --include-fragments --no-progress --root-dir "$(pwd)" --exclude-path build --exclude-path node_modules "./**/*.md"

            # The formatter, pinned to a major so the desk and the runner agree on the bytes, and
            # run as a gate rather than a suggestion: STYLE.md claims the tree is clang-format
            # clean, and this is what makes the claim true. The vendored and submodule code is
            # somebody else's tree and is not judged here.
            - name: Install clang-format
              run: python3 -m pip install --quiet "clang-format~=22.1"

            - name: Formatting must be canonical
              shell: bash
              run: |
                git ls-files -z -- '*.cpp' '*.hpp' '*.c' '*.h' ':!libs/program-abi/**'                     | xargs -0 clang-format --dry-run --Werror

            # The Program ABI is vendored from the flagship; a header that drifted from the
            # fingerprint beside it is a Program the Grid would refuse as stale.
            - name: Check the vendored Program ABI
              run: python3 tools/check_abi_vendor.py check

    build:
        name: Build (${{ matrix.preset }})
        needs: quick-checks
        timeout-minutes: 30

        strategy:
            fail-fast: false

            matrix:
                include:
                    - preset: windows-msvc
                      os: windows-latest
                      msvc-setup-needed: true
                    - preset: windows-clang-cl
                      os: windows-latest
                    - preset: windows-mingw
                      os: windows-latest
                    - preset: linux-gcc
                      os: ubuntu-latest
                    - preset: linux-clang
                      os: ubuntu-latest

        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup MSVC environment
              if: matrix.msvc-setup-needed
              shell: pwsh
              run: |
                  # Visual Studio ships on the Windows runners, so the developer environment is
                  # imported directly rather than through a third-party action: the repository
                  # policy allows GitHub-owned actions only.
                  $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
                  $install_path = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
                  if (-not $install_path) { throw "No Visual Studio installation with the C++ toolset was found." }
                  $vcvars = Join-Path $install_path "VC\Auxiliary\Build\vcvars64.bat"
                  if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found at $vcvars." }
                  # Run vcvars64 in cmd, then carry the resulting environment into later steps.
                  cmd /c "call `"$vcvars`" && set" | ForEach-Object {
                      if ($_ -match '^([^=]+)=(.*)$') {
                          $name = $matches[1]
                          $value = $matches[2]
                          # GITHUB_* are owned by the runner and must not be overwritten.
                          if ($name -notmatch '^(GITHUB_|RUNNER_)') {
                              "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
                          }
                      }
                  }

            # The panel is off here: a worm without its window builds and loads with no Qt at all,
            # which is a property the build must keep. The Qt legs arrive with Etape 6, with Qt
            # fetched by this repository's own script (GitHub-owned actions only).
            - name: Configure (panel off)
              run: cmake --preset=${{ matrix.preset }} -DRC_WORM_PANEL=OFF

            - name: Build and test (Debug)
              run: |
                cmake --build --preset=${{ matrix.preset }}-debug
                ctest --preset=${{ matrix.preset }}-debug

            - name: Build and test (Release)
              run: |
                cmake --build --preset=${{ matrix.preset }}-release
                ctest --preset=${{ matrix.preset }}-release

    sanitisers:
        name: Sanitiser (${{ matrix.name }})
        needs: quick-checks
        timeout-minutes: 30

        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: ASan+UBSan
                      preset: linux-clang-asan
                    - name: TSan
                      preset: linux-clang-tsan

        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Configure (panel off)
              run: cmake --preset=${{ matrix.preset }} -DRC_WORM_PANEL=OFF

            - name: Build (Debug)
              run: cmake --build --preset=${{ matrix.preset }}-debug

            - name: Test (Debug)
              run: ctest --preset=${{ matrix.preset }}-debug

    ci-success:
        name: CI Success
        needs: [quick-checks, build, sanitisers]
        runs-on: ubuntu-latest
        if: always()

        steps:
            - name: Check if all jobs succeeded
              run: |
                if [[ "${{ needs.quick-checks.result }}" != "success" ]] || \
                   [[ "${{ needs.build.result }}" != "success" ]] || \
                   [[ "${{ needs.sanitisers.result }}" != "success" ]]; then
                    echo "One or more jobs failed"
                    exit 1
                fi
                echo "All jobs completed successfully"
