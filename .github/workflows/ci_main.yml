name: CI - Main Branch

permissions:
    contents: read

# The Qt the runners fetch (.github/actions/setup-qt); the presets name the same version for the
# desk, and quick-checks refuses a tree where the two disagree.
env:
    QT_VERSION: 6.11.1

# Runs are queued rather than cancelled here: unlike a pull request, every commit that lands on main
# should keep a result of its own.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

on:
    push:
        branches: [main]

    workflow_dispatch:

jobs:
    quick-checks:
        name: Quick Checks (markdown)
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Node.js
              id: setup-node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                node-version: "lts/*"

            # Restore cache from main branch (read-only)
            - name: Restore npm cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                path: ~/.npm
                key: npm-${{ runner.os }}-node-${{ steps.setup-node.outputs.node-version }}-lock-${{ hashFiles('package-lock.json') }}

            # The linter is pinned by package-lock.json - the same bytes on every run and on every
            # desk - so a lint run is reproducible and a linter bump is a reviewable change rather
            # than a surprise red build. Dependabot proposes those bumps.
            - name: Install the pinned markdownlint-cli2
              run: npm ci --ignore-scripts

            - name: Lint markdown
              run: npx markdownlint-cli2 "**/*.md"

            # Save the npm cache so pull-request runs can restore it read-only.
            - name: Save npm cache
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                path: ~/.npm
                key: npm-${{ runner.os }}-node-${{ steps.setup-node.outputs.node-version }}-lock-${{ hashFiles('package-lock.json') }}

            # A carriage return sitting inside a line is invisible in every editor, survives
            # clang-format and markdownlint, and reads as ordinary text in review. Three reached
            # the flagship's main before this step existed there, each one a Doxygen \return
            # written through a tool chain that collapsed the escape, leaving a control character
            # and a word reading "eturn" where the tag should be.
            #
            # .gitattributes normalises to LF and this runner is Linux, so the checkout contains
            # no legitimate carriage return at all and any match is a stray. -I skips binary
            # files, and taking the file list from git keeps build outputs and untracked scratch
            # out of it.
            - name: Check for stray carriage returns
              run: |
                if git ls-files -z | xargs -0 grep -lIP '\r'; then
                    echo "::error::The files above contain a carriage return. Line endings here are LF, so it is a stray one inside a line - look for a text written through a tool that ate an escape."
                    exit 1
                fi

            # lychee is installed from its pinned release archive with a checksum check rather
            # than through lycheeverse/lychee-action: the organisation runs GitHub-owned actions
            # only, and a verified download keeps that policy - and the trust it means - intact.
            - name: Install lychee
              shell: bash
              env:
                LYCHEE_VERSION: v0.24.2
                LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
              run: |
                curl -sSfL -o lychee.tar.gz "https://github.com/lycheeverse/lychee/releases/download/lychee-${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
                echo "${LYCHEE_SHA256}  lychee.tar.gz" | sha256sum --check --strict
                tar -xzf lychee.tar.gz
                sudo install -m 755 lychee-x86_64-unknown-linux-gnu/lychee /usr/local/bin/lychee
                rm -rf lychee.tar.gz lychee-x86_64-unknown-linux-gnu
                lychee --version

            # Every internal link and anchor in the documentation resolves - offline, so the
            # answer is deterministic and a third-party site cannot redden a pull request. The
            # external links have their own scheduled workflow.
            - name: Check internal links and anchors
              run: lychee --offline --include-fragments --no-progress --root-dir "$(pwd)" --exclude-path build --exclude-path node_modules "./**/*.md"

            # The formatter, pinned to a major so the desk and the runner agree on the bytes, and
            # run as a gate rather than a suggestion: STYLE.md claims the tree is clang-format
            # clean, and this is what makes the claim true. The vendored and submodule code is
            # somebody else's tree and is not judged here.
            - name: Install clang-format
              run: python3 -m pip install --quiet "clang-format~=22.1"

            - name: Formatting must be canonical
              shell: bash
              run: |
                git ls-files -z -- '*.cpp' '*.hpp' '*.c' '*.h' ':!libs/program-abi/**'                     | xargs -0 clang-format --dry-run --Werror

            # The Program ABI is vendored from the flagship; a header that drifted from the
            # fingerprint beside it is a Program the Grid would refuse as stale.
            - name: Check the vendored Program ABI
              run: python3 tools/check_abi_vendor.py check

            # One Qt version, named twice: the kit paths in CMakePresets.json for the desk and
            # QT_VERSION above for the runners. They agree, or this says which one moved.
            - name: The Qt pin agrees with the presets
              shell: bash
              run: |
                presets=$(grep -ohP 'C:/Qt/\K[0-9.]+' CMakePresets.json | sort -u)
                if [[ "$presets" != "$QT_VERSION" ]]; then
                    echo "::error::CMakePresets.json names Qt '$presets' but this workflow pins QT_VERSION=$QT_VERSION - move both together."
                    exit 1
                fi

    build:
        name: Build, panel off (${{ matrix.preset }})
        needs: quick-checks
        timeout-minutes: 30

        strategy:
            fail-fast: false

            matrix:
                include:
                    - preset: windows-msvc
                      os: windows-latest
                      msvc-setup-needed: true
                    - preset: windows-clang-cl
                      os: windows-latest
                    - preset: windows-mingw
                      os: windows-latest
                    - preset: linux-gcc
                      os: ubuntu-latest
                    - preset: linux-clang
                      os: ubuntu-latest

        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup MSVC environment
              if: matrix.msvc-setup-needed
              shell: pwsh
              run: |
                  # Visual Studio ships on the Windows runners, so the developer environment is
                  # imported directly rather than through a third-party action: the repository
                  # policy allows GitHub-owned actions only.
                  $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
                  $install_path = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
                  if (-not $install_path) { throw "No Visual Studio installation with the C++ toolset was found." }
                  $vcvars = Join-Path $install_path "VC\Auxiliary\Build\vcvars64.bat"
                  if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found at $vcvars." }
                  # Run vcvars64 in cmd, then carry the resulting environment into later steps.
                  cmd /c "call `"$vcvars`" && set" | ForEach-Object {
                      if ($_ -match '^([^=]+)=(.*)$') {
                          $name = $matches[1]
                          $value = $matches[2]
                          # GITHUB_* are owned by the runner and must not be overwritten.
                          if ($name -notmatch '^(GITHUB_|RUNNER_)') {
                              "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
                          }
                      }
                  }

            # The panel is off here: a worm without its window builds and loads with no Qt at all,
            # which is a property the build must keep. The Qt legs are the job below. LLVM-MinGW
            # is not on the runners and stays a local preset.
            - name: Configure (panel off)
              run: cmake --preset=${{ matrix.preset }} -DRC_WORM_PANEL=OFF

            - name: Build and test (Debug)
              run: |
                cmake --build --preset=${{ matrix.preset }}-debug
                ctest --preset=${{ matrix.preset }}-debug

            - name: Build and test (Release)
              run: |
                cmake --build --preset=${{ matrix.preset }}-release
                ctest --preset=${{ matrix.preset }}-release


    build-qt:
        name: Build with Qt (${{ matrix.preset }})
        needs: quick-checks
        timeout-minutes: 45

        strategy:
            fail-fast: false

            matrix:
                include:
                    - preset: windows-msvc
                      os: windows-latest
                      kit: msvc2022_64
                      msvc-setup-needed: true
                    - preset: windows-clang-cl
                      os: windows-latest
                      kit: msvc2022_64
                    - preset: linux-gcc
                      os: ubuntu-latest
                      kit: gcc_64
                    - preset: linux-clang
                      os: ubuntu-latest
                      kit: gcc_64

        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup MSVC environment
              if: matrix.msvc-setup-needed
              shell: pwsh
              run: |
                  $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
                  $install_path = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
                  if (-not $install_path) { throw "No Visual Studio installation with the C++ toolset was found." }
                  $vcvars = Join-Path $install_path "VC\Auxiliary\Build\vcvars64.bat"
                  if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found at $vcvars." }
                  cmd /c "call `"$vcvars`" && set" | ForEach-Object {
                      if ($_ -match '^([^=]+)=(.*)$') {
                          $name = $matches[1]
                          $value = $matches[2]
                          if ($name -notmatch '^(GITHUB_|RUNNER_)') {
                              "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
                          }
                      }
                  }

            # What Qt needs of the platform, and what a windowed test needs: an X server to draw
            # into (the offscreen platform ships no fonts and lays text out pathologically slowly)
            # and a font for it to draw with. libxcb-cursor0 is the one Qt 6.5+ wants and lists
            # nowhere obvious.
            - name: Install the Linux runtime packages
              if: runner.os == 'Linux'
              run: |
                sudo apt-get update
                sudo apt-get install -y --no-install-recommends \
                    libgl1-mesa-dev libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
                    libxcb-render-util0 libxcb-shape0 libxcb-cursor0 libxcb-xinerama0 libfontconfig1 \
                    xvfb fonts-dejavu-core

            - name: Setup Qt
              uses: ./.github/actions/setup-qt
              with:
                version: ${{ env.QT_VERSION }}
                kit: ${{ matrix.kit }}

            # The presets name the desk's kit paths; the runner's kit overrides them.
            - name: Configure (panel on)
              shell: bash
              run: cmake --preset=${{ matrix.preset }} -DRC_WORM_PANEL=ON -DCMAKE_PREFIX_PATH="$QTDIR"

            - name: Build and test (Debug)
              shell: bash
              run: |
                cmake --build --preset=${{ matrix.preset }}-debug
                if [[ "${{ runner.os }}" == "Linux" ]]; then
                    xvfb-run -a ctest --preset=${{ matrix.preset }}-debug
                else
                    ctest --preset=${{ matrix.preset }}-debug
                fi

            - name: Build and test (Release)
              shell: bash
              run: |
                cmake --build --preset=${{ matrix.preset }}-release
                if [[ "${{ runner.os }}" == "Linux" ]]; then
                    xvfb-run -a ctest --preset=${{ matrix.preset }}-release
                else
                    ctest --preset=${{ matrix.preset }}-release
                fi

            # Every library the worm ships must be found beside it or in the system, never in
            # the Qt kit's directory or the build tree. On Windows the install runs windeployqt
            # on the DLL and tools/check_deploy.py judges what it produced: a closed set beside
            # rc_worm.dll, the platform plugin and the style included (docs/PANEL.md). On Linux
            # the Qt is the kit's or the distribution's, and ldd is recorded for the day that
            # changes.
            - name: Deploy the worm and judge what it needs
              shell: bash
              run: |
                if [[ "${{ runner.os }}" == "Linux" ]]; then
                    ldd build/${{ matrix.preset }}/bin/Release/librc_worm.so
                else
                    cmake --install build/${{ matrix.preset }} --config Release --prefix build/${{ matrix.preset }}-deploy
                    python3 tools/check_deploy.py build/${{ matrix.preset }}-deploy/programs
                fi

    sanitisers:
        name: Sanitiser (${{ matrix.name }})
        needs: quick-checks
        timeout-minutes: 30

        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: ASan+UBSan
                      preset: linux-clang-asan
                    - name: TSan
                      preset: linux-clang-tsan
                    # The Qt leg: the panel on, under ASan. Leaks are not counted - the
                    # un-instrumented Qt, fontconfig and glib stack reports its one-time
                    # allocations as leaks, and every one of them is somebody else's.
                    - name: ASan+UBSan with Qt
                      preset: linux-clang-asan
                      qt: true
                    # The panel's thread under ThreadSanitizer: the seam between the tick
                    # and the Qt thread is the one place a race would corrupt a mind's
                    # senses silently. Qt is not instrumented: its hand-offs are made
                    # visible by the atomics in panel.cpp, its own libraries are named in
                    # tools/tsan.supp, and the X stack (xcb, X11, D-Bus, glib - built
                    # without frame pointers, their mutex use beyond any suppression) is
                    # kept out of the process: the offscreen platform, the glib
                    # dispatcher off.
                    - name: TSan with Qt
                      preset: linux-clang-tsan
                      qt: true
                      qpa: offscreen
                      noglib: 1

        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install the Linux runtime packages
              if: matrix.qt
              run: |
                sudo apt-get update
                sudo apt-get install -y --no-install-recommends \
                    libgl1-mesa-dev libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
                    libxcb-render-util0 libxcb-shape0 libxcb-cursor0 libxcb-xinerama0 libfontconfig1 \
                    xvfb fonts-dejavu-core

            - name: Setup Qt
              if: matrix.qt
              uses: ./.github/actions/setup-qt
              with:
                version: ${{ env.QT_VERSION }}
                kit: gcc_64

            - name: Configure (panel off)
              if: ${{ !matrix.qt }}
              run: cmake --preset=${{ matrix.preset }} -DRC_WORM_PANEL=OFF

            - name: Configure (panel on)
              if: matrix.qt
              run: cmake --preset=${{ matrix.preset }} -DRC_WORM_PANEL=ON -DCMAKE_PREFIX_PATH="$QTDIR"

            - name: Build (Debug)
              run: cmake --build --preset=${{ matrix.preset }}-debug

            - name: Test (Debug)
              if: ${{ !matrix.qt }}
              run: ctest --preset=${{ matrix.preset }}-debug

            - name: Test (Debug, with Qt)
              if: matrix.qt
              env:
                ASAN_OPTIONS: detect_leaks=0
                TSAN_OPTIONS: suppressions=${{ github.workspace }}/tools/tsan.supp second_deadlock_stack=1
                QT_QPA_PLATFORM: ${{ matrix.qpa || 'xcb' }}
                QT_NO_GLIB: ${{ matrix.noglib || '0' }}
              run: xvfb-run -a ctest --preset=${{ matrix.preset }}-debug

    ci-success:
        name: CI Success
        needs: [quick-checks, build, build-qt, sanitisers]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        if: always()

        steps:
            - name: Check if all jobs succeeded
              run: |
                if [[ "${{ needs.quick-checks.result }}" != "success" ]] || \
                   [[ "${{ needs.build.result }}" != "success" ]] || \
                   [[ "${{ needs.build-qt.result }}" != "success" ]] || \
                   [[ "${{ needs.sanitisers.result }}" != "success" ]]; then
                    echo "One or more jobs failed"
                    exit 1
                fi
                echo "All jobs completed successfully"
